name: Daily Live Fixtures Update

on:
  schedule:
    # Runs automatically every day at 06:00 UTC (08:00 SAST)
    - cron: '0 6 * * *'
  workflow_dispatch: # Allows manual runs from GitHub anytime

permissions:
  contents: write

jobs:
  update-fixtures:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch latest fixtures
        run: python fetch_fixtures.py

      - name: Commit and push updated fixtures.json
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add fixtures.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update live fixtures" && git push)